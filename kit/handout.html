<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MI WAY Classroom – Handout</title>
<link rel="icon" href="../img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --ink: #0b0b0b; --ink-2: #3d3c39; --muted: #6b6964; --line: #e1e0d9; --accent: #1f4f9c; --soft: #e6eefb; --hero: #14306b; --ok: #18a05e; --font: 'Nunito', system-ui, 'Segoe UI', sans-serif; }
html[lang="ar"] { --font: 'Tajawal', 'Nunito', system-ui, sans-serif; }
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #d9d8d2; color: var(--ink); font: 10.5pt/1.4 var(--font); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet { width: 210mm; min-height: 297mm; margin: 12px auto; background: #fff; display: flex; flex-direction: column; }
header { background: linear-gradient(160deg, #2a78d6, var(--hero) 55%, #0d1b45); color: #fff; padding: 9mm 12mm 8mm; }
.brand { display: flex; align-items: center; gap: 3mm; font-weight: 900; font-size: 12pt; }
.brand img { width: 9mm; height: 9mm; border-radius: 2mm; }
.brand b { color: #fbbf24; }
h1 { font-size: 23pt; line-height: 1.12; margin: 4mm 0 2mm; font-weight: 900; letter-spacing: -.01em; }
h1 em { font-style: normal; color: #fbbf24; }
.tags { display: flex; flex-wrap: wrap; gap: 2mm; margin-top: 3mm; }
.tags span { background: rgba(255,255,255,.16); border-radius: 99px; padding: 1mm 3.2mm; font-weight: 800; font-size: 9pt; }
main { padding: 6mm 12mm 0; display: grid; gap: 5mm; flex: 1; }
h2 { font-size: 12.5pt; color: var(--accent); margin: 0 0 2mm; font-weight: 900; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; }
.step { background: var(--soft); border-radius: 3mm; padding: 3mm; }
.step b { display: inline-grid; place-items: center; width: 6mm; height: 6mm; border-radius: 50%; background: var(--accent); color: #fff; font-size: 9pt; margin-inline-end: 1.5mm; }
.step p { margin: 1mm 0 0; color: var(--ink-2); font-size: 9.5pt; }
.two { display: grid; grid-template-columns: 1.25fr 1fr; gap: 6mm; align-items: start; }
ul { margin: 0; padding-inline-start: 4.5mm; display: grid; gap: 1.6mm; }
li strong { color: var(--ink); }
li { color: var(--ink-2); }
.pics { display: grid; grid-template-columns: 1.6fr 1fr; gap: 3mm; align-items: end; }
.pics img { width: 100%; border-radius: 2.5mm; border: 1px solid var(--line); display: block; }
.proof { border: 1.5px solid var(--ok); border-radius: 3mm; padding: 3mm 4mm; display: flex; gap: 4mm; align-items: center; }
.proof .big { font-size: 20pt; font-weight: 900; color: var(--ok); white-space: nowrap; }
.proof p { margin: 0; color: var(--ink-2); }
.demo { background: #fff8e6; border-radius: 3mm; padding: 3mm 4mm; }
.demo ol { margin: 1mm 0 0; padding-inline-start: 5mm; display: grid; gap: 1mm; color: var(--ink-2); }
footer { margin-top: 5mm; border-top: 1px solid var(--line); padding: 5mm 12mm 7mm; display: flex; gap: 6mm; align-items: center; }
#qr { flex: none; width: 27mm; height: 27mm; }
#qr img, #qr canvas { width: 27mm !important; height: 27mm !important; }
.get { flex: 1; }
.get .url { font-size: 15pt; font-weight: 900; color: var(--accent); }
.get p { margin: .8mm 0 0; color: var(--ink-2); }
.credit { font-size: 8.5pt; color: var(--muted); margin-top: 1.5mm !important; }
.bar { width: 210mm; margin: 0 auto; display: flex; gap: 8px; justify-content: center; padding: 10px 16px 0; font: 700 14px var(--font); }
.bar a, .bar button { background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; color: var(--accent); text-decoration: none; cursor: pointer; font: inherit; }
@media print { body { background: #fff; } .sheet { margin: 0; } .bar { display: none; } }
@media screen and (max-width: 820px) { .sheet { zoom: .45; } .bar { width: auto; flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="bar"><a href="?l=fr">FR</a><a href="?l=en">EN</a><a href="?l=ar">ع</a><button onclick="print()" data-t="print"></button></div>
<div class="sheet">
  <header>
    <div class="brand"><img src="../img/icon.png" alt=""> MI WAY <b>Classroom</b></div>

    <div class="tags"><span data-t="tag1"></span><span data-t="tag2"></span><span data-t="tag3"></span><span data-t="tag4"></span></div>

  <main>

      <h2 data-t="how"></h2>

      </div>
      <div class="pics"><img src="../img/w-live.jpg" alt=""><img src="../img/p-student-q.jpg" alt=""></div>
    </section>
    <div class="proof"><div class="big" dir="ltr">42% → 58%</div><p data-t="proof"></p></div>
    <div class="demo"><h2 data-t="demo"></h2><ol><li data-t="d1"></li><li data-t="d2"></li><li data-t="d3"></li><li data-t="d4"></li></ol></div>
  </main>
  <footer>
    <div id="qr"></div>

      <p data-t="get"></p>
      <p data-t="contact"></p>
      <p class="credit">Created by RABII HAJOUI</p>

  </footer>
</div>
