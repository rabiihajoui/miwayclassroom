<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get MI WAY Classroom</title>
<meta name="description" content="Free live English quizzes. Students answer on their phones, no internet needed. Android and Windows.">
<meta property="og:title" content="MI WAY Classroom: free live quizzes for English classes">
<meta property="og:description" content="Students answer on their phones, no internet needed. Free for Android and Windows.">
<meta property="og:image" content="https://www.miwayclassroom.com/img/og.png">
<link rel="icon" href="../img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --page: #f6f5f1; --surface: #fcfcfb; --ink: #0b0b0b; --muted: #6b6964; --line: #e1e0d9; --accent: #1f4f9c; --accent-soft: #e6eefb; --ok: #18a05e; --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; }
@media (prefers-color-scheme: dark) { :root { --page: #12151c; --surface: #1b202b; --ink: #e8eaf0; --muted: #8d95a8; --line: #2e3647; --accent: #6c9ef8; --accent-soft: #1d2d4f; } }
html[lang="ar"] { --font: 'Tajawal', 'Nunito', system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 17px/1.55 var(--font); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.card { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; display: grid; gap: 16px; text-align: center; }
.brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; font-size: 1.15rem; }
.brand img { width: 40px; height: 40px; border-radius: 10px; }
.brand b { color: var(--accent); }
h1 { font-size: 1.45rem; line-height: 1.25; margin: 0; font-weight: 900; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
.btn { display: block; text-decoration: none; font-weight: 800; border-radius: 12px; padding: 14px 16px; background: var(--accent); color: #fff; font-size: 1.05rem; }
.btn.alt { background: var(--accent-soft); color: var(--accent); }
.btns { display: grid; gap: 10px; }
.spin { width: 34px; height: 34px; border: 4px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto; animation: s 0.9s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.steps { text-align: start; margin: 0; padding-inline-start: 22px; display: grid; gap: 6px; }
.steps b { color: var(--ink); }
#qr { display: grid; place-items: center; padding: 10px; background: #fff; border-radius: 12px; width: max-content; margin: 0 auto; }
.copy { display: flex; gap: 8px; }
.copy input { flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--page); color: var(--ink); }
.copy button { font: inherit; font-weight: 800; border: 0; border-radius: 10px; padding: 0 14px; background: var(--accent); color: #fff; cursor: pointer; }
.small { font-size: .85rem; }
.credit { font-size: .8rem; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><img src="../img/icon.png" alt=""><span>MI WAY <b>Classroom</b></span></div>

  <section id="v-go" class="btns" hidden>
    <div class="spin" aria-hidden="true"></div>
    <h1 data-t="go_t"></h1>
    <p data-t="go_p"></p>
  </section>

  <section id="v-win" hidden style="display:grid;gap:14px">
    <h1 data-t="win_t"></h1>
    <ol class="steps">
      <li data-t="win_1"></li>
      <li data-t="win_2"></li>
      <li data-t="win_3"></li>
    </ol>
    <a class="btn alt" id="win-again" data-t="win_again"></a>
  </section>

  <section id="v-other" hidden style="display:grid;gap:14px">
    <h1 data-t="oth_t"></h1>
    <p data-t="oth_p"></p>
    <div id="qr" aria-label="QR code"></div>
    <div class="copy"><input id="link" readonly aria-label="Link"><button type="button" id="copy" data-t="copy"></button></div>
  </section>

  <div class="btns" id="both">
    <p class="small" data-t="pick"></p>
    <a class="btn" id="b-android" data-t="android"></a>
    <a class="btn alt" id="b-windows" data-t="windows"></a>
  </div>
  <p class="small"><a href="../" data-t="more"></a></p>
  <p class="credit">Created by RABII HAJOUI</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const STATS = 'https://script.google.com/macros/s/AKfycbzds4d-KsP-LtuNuhBcqG3ZQGLf2Cqbzwt1Qq0Klfn7gugJ1lGXNwD-YiLscNY37HGQeA/exec';
const EXE = 'https://github.com/rabiihajoui/miwayclassroom/releases/latest/download/MI-WAY-Classroom-Setup.exe';
const PKG = 'com.miway.classroom';
const T = {
  en: { go_t: 'Opening Google Play…', go_p: 'Tap Install. It is free.', win_t: 'Your download has started', win_1: 'Open <b>MI-WAY-Classroom-Setup.exe</b> from your downloads.', win_2: 'If Windows shows a blue box, click <b>More info</b>, then <b>Run anyway</b>.', win_3: 'Start a lesson. Students join on their phones.', win_again: 'Download did not start? Click here', oth_t: 'Open this link on your Android phone or Windows laptop', oth_p: 'MI WAY Classroom runs on Android and Windows. It is not on iPhone or Mac yet. Scan the code with an Android phone, or copy the link.', copy: 'Copy', pick: 'Or choose:', android: 'Android phone or tablet', windows: 'Windows laptop', more: 'See the 1-minute video first' },
  fr: { go_t: 'Ouverture de Google Play…', go_p: 'Touchez Installer. C\'est gratuit.', win_t: 'Le téléchargement a commencé', win_1: 'Ouvrez <b>MI-WAY-Classroom-Setup.exe</b> dans vos téléchargements.', win_2: 'Si Windows affiche un cadre bleu, cliquez sur <b>Informations complémentaires</b>, puis <b>Exécuter quand même</b>.', win_3: 'Lancez une leçon. Les élèves rejoignent sur leur téléphone.', win_again: 'Le téléchargement n\'a pas commencé ? Cliquez ici', oth_t: 'Ouvrez ce lien sur votre téléphone Android ou votre PC Windows', oth_p: 'MI WAY Classroom fonctionne sur Android et Windows, pas encore sur iPhone ni Mac. Scannez le code avec un téléphone Android, ou copiez le lien.', copy: 'Copier', pick: 'Ou choisissez :', android: 'Téléphone ou tablette Android', windows: 'Ordinateur Windows', more: 'Voir d\'abord la vidéo d\'une minute' },
  ar: { go_t: 'جارٍ فتح Google Play…', go_p: 'اضغط "تثبيت". التطبيق مجاني.', win_t: 'بدأ التحميل', win_1: 'افتح <b>MI-WAY-Classroom-Setup.exe</b> من مجلد التنزيلات.', win_2: 'إذا ظهرت نافذة زرقاء، اضغط <b>More info</b> ثم <b>Run anyway</b>.', win_3: 'ابدأ درساً، والتلاميذ ينضمون من هواتفهم.', win_again: 'لم يبدأ التحميل؟ اضغط هنا', oth_t: 'افتح هذا الرابط على هاتف Android أو حاسوب Windows', oth_p: 'يعمل MI WAY Classroom على Android و Windows، وليس بعد على iPhone أو Mac. امسح الرمز بهاتف Android أو انسخ الرابط.', copy: 'نسخ', pick: 'أو اختر:', android: 'هاتف أو لوحة Android', windows: 'حاسوب Windows', more: 'شاهد فيديو الدقيقة أولاً' },
  es: { go_t: 'Abriendo Google Play…', go_p: 'Toca Instalar. Es gratis.', win_t: 'La descarga ha comenzado', win_1: 'Abre <b>MI-WAY-Classroom-Setup.exe</b> en tus descargas.', win_2: 'Si Windows muestra un cuadro azul, haz clic en <b>Más información</b> y luego en <b>Ejecutar de todas formas</b>.', win_3: 'Empieza una clase. Los alumnos entran desde el celular.', win_again: '¿No empezó la descarga? Haz clic aquí', oth_t: 'Abre este enlace en tu celular Android o tu computadora Windows', oth_p: 'MI WAY Classroom funciona en Android y Windows, todavía no en iPhone ni Mac. Escanea el código con un celular Android o copia el enlace.', copy: 'Copiar', pick: 'O elige:', android: 'Celular o tablet Android', windows: 'Computadora Windows', more: 'Ver primero el video de 1 minuto' },
  pt: { go_t: 'Abrindo o Google Play…', go_p: 'Toque em Instalar. É grátis.', win_t: 'O download começou', win_1: 'Abra <b>MI-WAY-Classroom-Setup.exe</b> nos seus downloads.', win_2: 'Se o Windows mostrar uma caixa azul, clique em <b>Mais informações</b> e depois em <b>Executar assim mesmo</b>.', win_3: 'Comece uma aula. Os alunos entram pelo celular.', win_again: 'O download não começou? Clique aqui', oth_t: 'Abra este link no seu celular Android ou notebook Windows', oth_p: 'O MI WAY Classroom funciona no Android e no Windows, ainda não no iPhone nem no Mac. Escaneie o código com um celular Android ou copie o link.', copy: 'Copiar', pick: 'Ou escolha:', android: 'Celular ou tablet Android', windows: 'Computador Windows', more: 'Ver primeiro o vídeo de 1 minuto' },
};
const q = new URLSearchParams(location.search);
const tag = (v) => String(v || '').replace(/[^\w-]/g, '').slice(0, 24);
const hook = tag(q.get('h')), src = tag(q.get('s'));
const lang = T[tag(q.get('l'))] ? tag(q.get('l')) : (Object.keys(T).find((k) => (navigator.language || '').startsWith(k)) || 'en');
const t = T[lang];
document.documentElement.lang = lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = t[el.dataset.t]; });

const ua = navigator.userAgent;
const dev = /Android/i.test(ua) ? 'android' : /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios' : /Windows/i.test(ua) ? 'windows' : /Macintosh/i.test(ua) ? 'mac' : 'other';
const ref = encodeURIComponent(`utm_source=${src || 'link'}&utm_medium=post&utm_campaign=${hook || 'none'}-${lang}`);
const play = `https://play.google.com/store/apps/details?id=${PKG}&hl=${lang}&referrer=${ref}`;
document.getElementById('b-android').href = play;
document.getElementById('b-windows').href = EXE;
document.getElementById('win-again').href = EXE;

function count(device) {
  try { fetch(STATS, { method: 'POST', mode: 'no-cors', keepalive: true, body: JSON.stringify({ click: 1, h: hook, l: lang, s: src, dev: device }) }); } catch (e) {}
}
const show = (id) => { document.getElementById(id).hidden = false; };

let seen = false;
try { seen = sessionStorage.getItem('mw-counted') === location.search; sessionStorage.setItem('mw-counted', location.search); } catch (e) {}
if (!seen) count(dev);
if (dev === 'android') {
  show('v-go');
  setTimeout(() => { location.href = `market://details?id=${PKG}&referrer=${ref}`; }, 300);
  setTimeout(() => { if (!document.hidden) location.href = play; }, 1800);
} else if (dev === 'windows') {
  show('v-win');
  setTimeout(() => { location.href = EXE; }, 500);
} else {
  show('v-other');
  const link = location.href;
  document.getElementById('link').value = link;
  try { new QRCode(document.getElementById('qr'), { text: link, width: 180, height: 180 }); } catch (e) { document.getElementById('qr').hidden = true; }
  document.getElementById('copy').onclick = async () => {
    const box = document.getElementById('link');
    try { await navigator.clipboard.writeText(link); } catch (e) { box.select(); document.execCommand('copy'); }
    document.getElementById('copy').textContent = '✓';
  };
}
</script>
</body>
</html>
